<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080b10">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>RED808 Mobile</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/theme-vars.css">
  <link rel="stylesheet" href="/mobile.css">
</head>
<body>
  <!-- Top transport bar -->
  <header class="m-top">
    <div class="m-top-row m-top-row1">
      <div class="m-brand">
        <span class="m-dot" id="connDot" title="Conexión"></span>
        <span class="m-logo">RED<b>808</b></span>
      </div>
      <button class="m-theme-btn" id="themeBtn" aria-label="Tema visual" title="Tema visual">🎨</button>
    </div>
    <div class="m-top-row m-top-row2">
      <div class="m-transport">
        <button class="m-play" id="playBtn" aria-label="Play/Stop">▶</button>
        <div class="m-bpm">
          <button class="m-bpm-btn" id="bpmDown">−</button>
          <span class="m-bpm-val" id="bpmVal">120</span>
          <button class="m-bpm-btn" id="bpmUp">+</button>
        </div>
        <select class="m-pattern" id="patternSel" aria-label="Patrón"></select>
      </div>
    </div>
  </header>

  <!-- View container -->
  <main class="m-main">
    <!-- PADS -->
    <section class="m-view is-active" id="view-pads">
      <div class="m-pads" id="padsGrid"></div>
    </section>

    <!-- PIANO -->
    <section class="m-view" id="view-piano">
      <div class="m-piano-bar">
        <label>Motor
          <select id="pianoEngine">
            <option value="3">303</option>
            <option value="4">WaveTable</option>
            <option value="5">SH-101</option>
            <option value="6">FM</option>
          </select>
        </label>
        <div class="m-oct">
          <button id="octDown">Oct −</button>
          <span id="octVal">4</span>
          <button id="octUp">Oct +</button>
        </div>
      </div>
      <div class="m-piano" id="piano"></div>
    </section>

    <!-- SEQUENCER (grid of colored dots) -->
    <section class="m-view" id="view-seq">
      <div class="m-seq-tools">
        <div class="m-step-count" id="stepCountSel"></div>
        <button class="m-clear" id="seqClear">Limpiar</button>
      </div>
      <div class="m-seq-scroll">
        <div class="m-seq" id="seqGrid"></div>
      </div>
    </section>

    <!-- FILTERS / FX -->
    <section class="m-view" id="view-fx">
      <div class="m-fx-track">
        <label>Pista
          <select id="fxTrack"></select>
        </label>
      </div>
      <div class="m-filters" id="filterGrid"></div>
      <div class="m-fx-sliders">
        <label class="m-slider">
          <span>Cutoff <b id="cutoffVal">1000 Hz</b></span>
          <input type="range" id="cutoff" min="40" max="12000" step="10" value="1000">
        </label>
        <label class="m-slider">
          <span>Resonancia <b id="resVal">2.0</b></span>
          <input type="range" id="resonance" min="0.5" max="18" step="0.1" value="2">
        </label>
      </div>
    </section>
  </main>

  <!-- Theme picker (bottom sheet) -->
  <div class="m-sheet-backdrop" id="sheetBackdrop" hidden></div>
  <div class="m-theme-sheet" id="themeSheet" hidden>
    <div class="m-theme-sheet-head">🎨 Tema visual</div>
    <div class="m-theme-options" id="themeOptions"></div>
  </div>

  <!-- Bottom view switcher -->
  <nav class="m-nav">
    <button class="m-tab is-active" data-view="pads">🥁<span>Pads</span></button>
    <button class="m-tab" data-view="piano">🎹<span>Piano</span></button>
    <button class="m-tab" data-view="seq">🟢<span>Seq</span></button>
    <button class="m-tab" data-view="fx">🎛️<span>Filtros</span></button>
  </nav>

  <script src="/mobile.js" defer></script>
</body>
</html>
