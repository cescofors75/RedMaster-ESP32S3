<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>RED808 · GESTURE</title>
    <script src="nav.js"></script>
    <link rel="stylesheet" href="theme-vars.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;-webkit-tap-highlight-color:transparent}
#videoEl{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:0;transition:opacity .5s;z-index:1}
#videoEl.on{opacity:.92}
#mainCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
/* Corner pills */
.cpill{
  position:fixed;width:60px;height:60px;border-radius:50%;z-index:10;
  display:flex;align-items:center;justify-content:center;
  font-family:Impact,"Arial Black",sans-serif;font-size:14px;letter-spacing:2px;
  cursor:pointer;user-select:none;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1.5px solid rgba(255,255,255,.14);
  background:rgba(8,6,10,.58);color:rgba(255,255,255,.6);
  opacity:.26;transition:opacity .28s,box-shadow .28s,border-color .28s,background .28s
}
.cpill:active{transform:scale(.86)}
.cpill.active{opacity:.92;color:#fff;border-color:rgba(255,255,255,.55)}
#pillS{top:20px;left:20px}
#pillS.active{background:rgba(255,79,67,.3);border-color:#ff4f43;box-shadow:0 0 24px rgba(255,79,67,.5)}
#pillP{top:20px;right:20px}
#pillP.active{background:rgba(52,152,219,.3);border-color:#3498db;box-shadow:0 0 24px rgba(52,152,219,.5)}
#pillFX{bottom:calc(20px + env(safe-area-inset-bottom,0px));left:20px}
#pillFX.active{background:rgba(46,204,113,.26);border-color:#2ecc71;box-shadow:0 0 24px rgba(46,204,113,.45)}
#pillPAT{bottom:calc(20px + env(safe-area-inset-bottom,0px));right:20px}
#pillPAT.active{background:rgba(155,89,182,.3);border-color:#9b59b6;box-shadow:0 0 24px rgba(155,89,182,.5)}
/* Mode label */
#modeLabel{
  position:fixed;top:28px;left:50%;transform:translateX(-50%);
  z-index:10;font-family:Impact,"Arial Black",sans-serif;font-size:10px;letter-spacing:5px;
  color:rgba(255,255,255,.5);pointer-events:none;
  padding:5px 16px;background:rgba(0,0,0,.38);border-radius:20px;
  backdrop-filter:blur(10px);transition:opacity .4s
}
#modeLabel.hide{opacity:0}
/* Flash */
#gFlash{
  position:fixed;z-index:12;pointer-events:none;
  top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:Impact,"Arial Black",sans-serif;font-size:0;letter-spacing:7px;
  opacity:0;transition:opacity .08s,font-size .09s;white-space:nowrap
}
#gFlash.show{opacity:1;font-size:60px}
/* Hint bar */
#gestureHint{
  position:fixed;bottom:calc(96px + env(safe-area-inset-bottom,0px));
  left:50%;transform:translateX(-50%);z-index:10;
  max-width:calc(100vw - 120px);padding:8px 12px;border-radius:8px;
  font-size:8px;line-height:1.55;letter-spacing:2px;color:rgba(255,255,255,.78);
  background:rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  pointer-events:none;transition:opacity .5s;text-align:center;white-space:normal
}
#gestureHint.hide{opacity:0}
/* Live status */
#gestureStatus{
  position:fixed;top:calc(58px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);
  z-index:10;max-width:calc(100vw - 110px);min-width:210px;
  padding:7px 10px;border-radius:8px;text-align:center;
  font-size:8px;line-height:1.45;letter-spacing:1.8px;color:rgba(255,255,255,.76);
  background:rgba(0,0,0,.56);border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  pointer-events:none;opacity:.86;transition:opacity .25s,border-color .25s,color .25s
}
#gestureStatus.good{border-color:rgba(46,204,113,.42);color:#c8ffd9}
#gestureStatus.warn{border-color:rgba(255,193,7,.5);color:#ffe2a8}
#gestureStatus.hot{border-color:rgba(255,79,67,.55);color:#ffc3bd}
#gestureStatus.hide{opacity:0}
/* WS dot */
#wsDot{
  position:fixed;top:31px;left:50%;transform:translateX(82px);
  z-index:11;width:7px;height:7px;border-radius:50%;
  background:#c0392b;transition:.2s;pointer-events:none
}
#wsDot.on{background:#2ecc71;box-shadow:0 0 10px #2ecc71}
/* Start overlay */
#startOverlay{
  position:fixed;inset:0;z-index:20;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(ellipse at center,#130a1a 0%,#050306 100%);
  cursor:pointer;transition:opacity .5s
}
#startOverlay.gone{opacity:0;pointer-events:none}
.s-logo{font-family:Impact,"Arial Black",sans-serif;font-size:52px;letter-spacing:10px;color:#ff4f43;text-shadow:0 0 48px rgba(255,79,67,.6)}
.s-sub{font-size:8px;letter-spacing:6px;color:rgba(255,255,255,.32)}
.s-tap{font-size:10px;letter-spacing:4px;color:rgba(255,255,255,.46);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.12}}
</style>
</head>
<body>
<div id="startOverlay">
  <div class="s-logo">RED808</div>
  <div class="s-sub">GESTURE CONTROLLER</div>
  <div class="s-tap">TAP TO START</div>
</div>
<video id="videoEl" autoplay muted playsinline></video>
<canvas id="mainCanvas"></canvas>
<div id="pillS"  class="cpill active" onclick="setMode('S')">S</div>
<div id="pillP"  class="cpill"        onclick="setMode('P')">P</div>
<div id="pillFX" class="cpill"        onclick="setMode('FX')">FX</div>
<div id="pillPAT"class="cpill"        onclick="setMode('PAT')">PAT</div>
<div id="modeLabel">SAMPLERS</div>
<div id="gFlash"></div>
<div id="gestureHint"></div>
<div id="gestureStatus" class="hide"></div>
<div id="wsDot"></div>

<script>
'use strict';

// ── Constants ─────────────────────────────────────────────────────
const PAD_MAP={kick:0,snare:1,hihat:2,oh:3,ride:4,clap:5,bass:6,tom:8};
const R_PADS=['kick','snare','hihat','clap'];
const L_PADS=['tom','bass','ride','oh'];
const PAD_RGB={kick:'255,79,67',snare:'255,140,80',hihat:'243,156,18',clap:'255,100,90',tom:'230,126,34',bass:'155,89,182',ride:'46,204,113',oh:'243,156,18'};
const IS_TOUCH=matchMedia('(pointer:coarse)').matches;
const CONFIRM_N=IS_TOUCH?2:3;
const CONFIRM_S=IS_TOUCH?1:2;
const GCD_PAD=IS_TOUCH?95:130;
const GCD_PAT=680;
const FX_T=36; // ms throttle for continuous FX

// ── State ─────────────────────────────────────────────────────────
let ws=null,wsTimer=null;
let useCamera=false,camStream=null,mpHands=null,handsPromise=null,frameBusy=false,frameHandle=0;
let handSendErrShown=false;
let liveLmR=null,liveLmL=null,livePoseR=null,livePoseL=null;
let rBuf=[],lBuf=[],presetBuf=[],prevWristR=null,prevWristL=null;
let lastCommR=null,lastCommL=null;
const gLastT={};
let activeMode='S';
let flashAlpha=0,flashRgb='255,79,67',lastLoopT=0,synthPhase=0,masterEnergy=0;
let curPatIdx=0,curPlaying=false;
// FX state
let lastFxRT=0,lastFxLT=0,lastPitchT=0;
let curCutoff=8000,curReso=0,curReverb=40,curDelay=0,curPitch=1;
let delayOn=false,reverbOn=false,distOn=false;
let bassReady=false,curBassCutoff=1200,curBassReso=.72,curBassEnv=.65,curBassDrive=.12;
let fxReady=false;
let activeBassNote=null,activeBassIdx=-1,lastBassVel=0,bassReadyFlashT=0;
let curPianoPreset=0,lastPianoTapY=null,lastPresetConf=null;
let fxResetHoldStart=0,fxResetArmed=false,fxResetProgress=0;
let lastStatusText='',lastStatusTone='',statusTmr=null;
const BASS_ENGINE=3,BASS_TRACK=0,BASS_NOTES=[36,39,43,48];
const PIANO_PRESETS=[
  {name:'CLASSIC',cut:1200,cutLo:360,cutHi:5200,reso:.72,env:.65,dec:.35,acc:.60,slide:.09,wave:0,vol:.80,atk:.001,sus:0,rel:.15,drv:.12,sub:.08,drift:.04},
  {name:'SQUELCH',cut:900,cutLo:280,cutHi:7600,reso:.92,env:.95,dec:.45,acc:.85,slide:.12,wave:0,vol:.85,atk:.001,sus:0,rel:.18,drv:.28,sub:.06,drift:.08},
  {name:'SUB',cut:240,cutLo:90,cutHi:2600,reso:.45,env:.25,dec:.60,acc:.25,slide:.06,wave:1,vol:.90,atk:.004,sus:.45,rel:.35,drv:.18,sub:.45,drift:.02},
  {name:'SOFT',cut:2200,cutLo:520,cutHi:9800,reso:.58,env:.40,dec:.80,acc:.35,slide:.15,wave:1,vol:.75,atk:.010,sus:.35,rel:.40,drv:.08,sub:.18,drift:.12},
];
const NOTE_NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function noteName(note){return NOTE_NAMES[note%12]+(Math.floor(note/12)-1)}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v))}
let modeLabelTmr=null,hintTmr=null,flashTmr=null;
const particles=[];
const trailR=[],trailL=[],TRAIL=24;

// ── WebSocket ─────────────────────────────────────────────────────
function wsUrl(){return`${location.protocol==='https:'?'wss:':'ws:'}//${location.host}/ws`}
function setWsDot(on){document.getElementById('wsDot').classList.toggle('on',on)}
function schedWs(){if(wsTimer)return;wsTimer=setTimeout(()=>{wsTimer=null;initWs()},1400)}
function initWs(){
  try{
    if(ws&&ws.readyState<=1)return;
    ws=new WebSocket(wsUrl());ws.binaryType='arraybuffer';
    ws.onopen=()=>{setWsDot(true);if(activeMode==='P')ensureBass(true);if(activeMode==='FX')ensureFx(true)};
    ws.onclose=()=>{setWsDot(false);schedWs()};
    ws.onerror=()=>setWsDot(false);
    ws.onmessage=onWsMsg;
  }catch{setWsDot(false);schedWs()}
}
function isWsOpen(){return !!(ws&&ws.readyState===WebSocket.OPEN)}
function showNoWs(){showFlash('NO WS','#ffcc80')}
function setStatus(text,tone=''){
  if(text===lastStatusText&&tone===lastStatusTone)return;
  lastStatusText=text;lastStatusTone=tone;
  const e=document.getElementById('gestureStatus');
  if(!text){e.className='hide';e.textContent='';return}
  e.textContent=text;e.className=tone||'';
  clearTimeout(statusTmr);
  if(activeMode==='S'||activeMode==='PAT')statusTmr=setTimeout(()=>e.classList.add('hide'),900);
}
function sendJ(obj){if(isWsOpen()){ws.send(JSON.stringify(obj));return true}return false}
function send303Param(paramId,value){sendJ({cmd:'synth303Param',paramId,value})}
function apply303Preset(i,force=false){
  const p=PIANO_PRESETS[clamp(i,0,PIANO_PRESETS.length-1)];
  curPianoPreset=i;curBassCutoff=p.cut;curBassReso=p.reso;curBassEnv=p.env;curBassDrive=p.drv;
  sendJ({cmd:'synthPreset',engine:BASS_ENGINE,preset:i});
  send303Param(0,p.cut);send303Param(1,p.reso);send303Param(2,p.env);send303Param(3,p.dec);
  send303Param(4,p.acc);send303Param(5,p.slide);send303Param(6,p.wave);send303Param(7,p.vol);
  send303Param(8,p.atk);send303Param(9,p.sus);send303Param(10,p.rel);send303Param(11,p.drv);
  send303Param(12,p.sub);send303Param(13,p.drift);send303Param(14,0);
  if(force)showFlash(p.name,'#90caf9');
  setStatus(`303 ${p.name} · 1-4 NOTAS · X/Y/Z PARAMS`,'good');
}
function ensureBass(force=false){
  if(!isWsOpen())return false;
  if(bassReady&&!force)return true;
  sendJ({cmd:'setTrackSynthEngine',track:BASS_TRACK,engine:BASS_ENGINE});
  bassReady=true;
  apply303Preset(curPianoPreset,force);
  curReverb=28;
  sendJ({cmd:'setReverbActive',value:true});
  sendJ({cmd:'setReverbMix',value:curReverb});
  reverbOn=true;
  sendJ({cmd:'setDelayActive',value:false});
  curDelay=0;
  delayOn=false;
  const n=Date.now();
  if(force||n-bassReadyFlashT>2200){showFlash('303 READY','#90caf9');bassReadyFlashT=n}
  setStatus('303 ACID SOLO · 1-4 NOTAS · PALMA PRESET · X/Y/Z SONIDO','good');
  return true;
}
function ensureFx(force=false){
  if(!isWsOpen())return false;
  if(fxReady&&!force)return true;
  sendJ({cmd:'setFilter',type:1});
  sendJ({cmd:'setFilterCutoff',value:curCutoff});
  sendJ({cmd:'setFilterResonance',value:curReso});
  if(reverbOn){sendJ({cmd:'setReverbActive',value:true});sendJ({cmd:'setReverbMix',value:curReverb})}
  if(delayOn){sendJ({cmd:'setDelayActive',value:true});sendJ({cmd:'setDelayMix',value:curDelay})}
  fxReady=true;
  setStatus('FX READY · R: FILTER/RESO · L: RVB/DLY · HOLD FIST RESET','good');
  return true;
}
function stopBassNote(reason=''){
  if(activeBassNote===null)return;
  sendJ({cmd:'synth303NoteOff'});
  activeBassNote=null;activeBassIdx=-1;
  lastPianoTapY=null;
  if(reason)setStatus(reason,'warn');
}
function triggerBassNote(i,vel=112,force=false){
  if(!ensureBass()){showNoWs();return}
  const note=BASS_NOTES[Math.max(0,Math.min(BASS_NOTES.length-1,i))];
  if(activeBassNote===note&&!force)return;
  if(activeBassNote!==null)sendJ({cmd:'synth303NoteOff'});
  const p=PIANO_PRESETS[curPianoPreset]||PIANO_PRESETS[0];
  sendJ({cmd:'synth303NoteOn',note,accent:vel>108||p.acc>.75,slide:p.slide>.11});
  activeBassNote=note;activeBassIdx=i;lastBassVel=vel;
  showFlash(noteName(note),'#90caf9');
  setStatus(`303 ${noteName(note)} · ${p.name} · ${force?'TAP':'HOLD'}`,'good');
}
function onWsMsg(ev){
  if(ev.data instanceof ArrayBuffer){
    const d=new Uint8Array(ev.data);
    if(d[0]===0xAA&&d.length>=9){let s=0;for(let i=1;i<9;i++)s+=(d[i]||0)/255;masterEnergy=Math.min(1,s/8)}
    return;
  }
  try{
    const m=JSON.parse(ev.data);
    if(m.type==='playState'||m.playing!==undefined)curPlaying=!!(m.playing??curPlaying);
    if((m.type==='pattern'||m.type==='songPattern')&&(m.index??m.pattern)!==undefined)curPatIdx=m.index??m.pattern??0;
  }catch{}
}

// ── Trigger audio pad ─────────────────────────────────────────────
async function triggerPad(name,vel=112){
  const pad=PAD_MAP[name];if(pad===undefined)return;
  if(ws&&ws.readyState===WebSocket.OPEN)ws.send(new Uint8Array([0x90,pad,vel]));
  else fetch(`${location.origin}/api/trigger?pad=${pad}`,{cache:'no-store'}).catch(()=>{});
  flashRgb=PAD_RGB[name]||'255,79,67';flashAlpha=.15+vel/127*.3;
  try{navigator.vibrate&&navigator.vibrate(20)}catch{}
}

// ── Mode system ───────────────────────────────────────────────────
const MODES={
  S:{label:'SAMPLERS',   hint:'1-4 DEDOS DERECHA · 1-4 DEDOS IZQUIERDA', col:'255,79,67'},
  P:{label:'303 ACID SOLO',hint:'CUALQUIER MANO: 1-4 DEDOS = NOTAS · X/Y/Z = SONIDO · PALMA = PRESET · PUÑO = SOLTAR', col:'52,152,219'},
  FX:{label:'FX',        hint:'FX ON UNA VEZ · PUÑO=RESET · DERECHA FILTRO/RESO Y REVERB SI NO HAY IZQ', col:'46,204,113'},
  PAT:{label:'PATRONES', hint:'1-4 DEDOS DERECHA=PAT 1-4  ·  IZQUIERDA=PAT 5-8', col:'155,89,182'},
};
function setMode(m){
  if(m===activeMode)return;
  const prev=activeMode;activeMode=m;
  rBuf=[];lBuf=[];presetBuf=[];lastCommR=null;lastCommL=null;lastPresetConf=null;
  lastFxRT=0;lastFxLT=0;lastPitchT=0;
  fxResetHoldStart=0;fxResetArmed=false;fxResetProgress=0;
  if(prev==='P')stopBassNote('303 OFF');
  // reset pitch when leaving 303 performance mode
  if(prev==='P'&&curPitch!==1){sendJ({cmd:'setLivePitch',pitch:1});curPitch=1}
  if(m==='P')ensureBass(true);
  if(m==='FX')ensureFx(true);
  updateModeUI();
}
function updateModeUI(){
  ['S','P','FX','PAT'].forEach(m=>document.getElementById('pill'+m).classList.toggle('active',m===activeMode));
  const meta=MODES[activeMode];
  const lbl=document.getElementById('modeLabel');
  lbl.textContent=meta.label;lbl.classList.remove('hide');
  clearTimeout(modeLabelTmr);modeLabelTmr=setTimeout(()=>lbl.classList.add('hide'),2200);
  const hint=document.getElementById('gestureHint');
  hint.textContent=meta.hint;hint.classList.remove('hide');
  clearTimeout(hintTmr);hintTmr=setTimeout(()=>hint.classList.add('hide'),3500);
  setStatus(activeMode==='P'?'303 ARMING':activeMode==='FX'?'FX ARMING':'','warn');
}

// ── Flash text ────────────────────────────────────────────────────
function showFlash(t,hex='#ff8a7f'){
  const e=document.getElementById('gFlash');
  e.textContent=t;e.style.color=hex;e.style.textShadow=`0 0 44px ${hex}99`;
  e.classList.add('show');clearTimeout(flashTmr);flashTmr=setTimeout(()=>e.classList.remove('show'),460);
}

// ── GCD gate ──────────────────────────────────────────────────────
function canFire(key,ms){const n=Date.now();if(!gLastT[key]||n-gLastT[key]>=ms){gLastT[key]=n;return true}return false}

// ── Hand pose ─────────────────────────────────────────────────────
function hSz(lm){return Math.hypot(lm[0].x-lm[9].x,lm[0].y-lm[9].y)||.1}
function fUp(tip,pip,sz){return pip.y-tip.y>sz*.12}
function tUp(tt,ti,sz){return ti.y-tt.y>sz*.08}
function getPose(lm){
  const sz=hSz(lm),tt=lm[4],ti=lm[3],it=lm[8],ip=lm[6],mt=lm[12],mp=lm[10],rt=lm[16],rp=lm[14],pt=lm[20],pp=lm[18];
  const tU=tUp(tt,ti,sz),iU=fUp(it,ip,sz),mU=fUp(mt,mp,sz),rU=fUp(rt,rp,sz),pU=fUp(pt,pp,sz);
  const nonThumb=[iU,mU,rU,pU].filter(Boolean).length;
  const allCount=(tU?1:0)+nonThumb;
  const fist=!tU&&!iU&&!mU&&!rU&&!pU;
  const openPalm=tU===true&&nonThumb===4;
  return{tU,iU,mU,rU,pU,nonThumb,allCount,fist,openPalm,sz};
}
function confGest(buf,g,n){buf.push(g);if(buf.length>n)buf.shift();if(buf.length<n)return null;const l=buf[buf.length-1];return l&&buf.every(x=>x===l)?l:null}
function wristVel(lm,prev){
  const w=lm?.[0];if(!w)return{v:96,nxt:prev};if(!prev)return{v:96,nxt:{x:w.x,y:w.y}};
  const d=Math.hypot(w.x-prev.x,w.y-prev.y);return{v:Math.max(55,Math.min(127,Math.round(62+d*950))),nxt:{x:w.x,y:w.y}};
}

// ── MODE S — Samplers ─────────────────────────────────────────────
function procS(lmR,lmL){
  if(lmR){
    const p=getPose(lmR),raw=p.nonThumb>=1&&p.nonThumb<=4?'r'+p.nonThumb:null;
    const conf=confGest(rBuf,raw,CONFIRM_S);
    if(conf&&canFire('s_'+conf,GCD_PAD)){
      lastCommR=conf;
      const e=wristVel(lmR,prevWristR);prevWristR=e.nxt;
      triggerPad(R_PADS[parseInt(conf[1])-1],e.v);
      spawnBurst(mirror(lmR)[8],e.v,'r');
    }
  }else{rBuf=[];lastCommR=null;prevWristR=null}
  if(lmL){
    const p=getPose(lmL),raw=p.nonThumb>=1&&p.nonThumb<=4?'l'+p.nonThumb:null;
    const conf=confGest(lBuf,raw,CONFIRM_S);
    if(conf&&canFire('s_'+conf,GCD_PAD)){
      lastCommL=conf;
      const e=wristVel(lmL,prevWristL);prevWristL=e.nxt;
      triggerPad(L_PADS[parseInt(conf[1])-1],e.v);
      spawnBurst(mirror(lmL)[8],e.v,'l');
    }
  }else{lBuf=[];lastCommL=null;prevWristL=null}
}

// ── MODE PAT — Patterns ───────────────────────────────────────────
function procPAT(lmR,lmL){
  if(lmR){
    const p=getPose(lmR),raw=p.nonThumb>=1&&p.nonThumb<=4?'rp'+p.nonThumb:null;
    if(raw!==lastCommR)lastCommR=null;
    const conf=confGest(rBuf,raw,CONFIRM_N);
    if(conf&&conf!==lastCommR&&canFire(conf,GCD_PAT)){
      lastCommR=conf;const idx=parseInt(conf[2])-1;
      if(idx!==curPatIdx){curPatIdx=idx;sendJ({cmd:'selectPattern',index:idx});showFlash('PAT '+(idx+1),'#b39ddb');try{navigator.vibrate&&navigator.vibrate(30)}catch{}}
    }
  }else{rBuf=[];lastCommR=null}
  if(lmL){
    const p=getPose(lmL),raw=p.nonThumb>=1&&p.nonThumb<=4?'lp'+p.nonThumb:null;
    if(raw!==lastCommL)lastCommL=null;
    const conf=confGest(lBuf,raw,CONFIRM_N);
    if(conf&&conf!==lastCommL&&canFire(conf,GCD_PAT)){
      lastCommL=conf;const idx=parseInt(conf[2])-1+4;
      if(idx!==curPatIdx){curPatIdx=idx;sendJ({cmd:'selectPattern',index:idx});showFlash('PAT '+(idx+1),'#b39ddb');try{navigator.vibrate&&navigator.vibrate(30)}catch{}}
    }
  }else{lBuf=[];lastCommL=null}
}

// ── MODE P — 303 Acid Solo ─────────────────────────────────────────
function procP(lmR,lmL){
  const now=Date.now();
  ensureBass();

  const rPose=lmR?getPose(lmR):null,lPose=lmL?getPose(lmL):null;
  const rPlayable=rPose&&rPose.nonThumb>=1&&rPose.nonThumb<=4;
  const lPlayable=lPose&&lPose.nonThumb>=1&&lPose.nonThumb<=4;
  const soloHand=lPlayable?lmL:(rPlayable?lmR:(lmL||lmR));
  const soloPose=soloHand==lmL?lPose:rPose;
  const soloSide=soloHand==lmL?'l':'r';
  if(soloHand&&soloPose){
    const buf=soloSide==='l'?lBuf:rBuf;
    if(soloPose.fist){stopBassNote('303 RELEASE');if(soloSide==='l'){lBuf=[];lastCommL=null}else{rBuf=[];lastCommR=null};return}
    if(soloPose.openPalm&&canFire('p_preset_palm',620)){
      apply303Preset((curPianoPreset+1)%PIANO_PRESETS.length,true);
      try{navigator.vibrate&&navigator.vibrate(24)}catch{}
    }
    const preset=PIANO_PRESETS[curPianoPreset]||PIANO_PRESETS[0];
    const idx=soloHand[8];
    const z=clamp((-idx.z+.12)/.28,0,1);
    const cutoff=Math.round(preset.cutLo+(1-idx.y)*(preset.cutHi-preset.cutLo));
    const reso=clamp(preset.reso+(idx.x-.5)*.42,.15,.98);
    const env=clamp(preset.env+(z-.5)*.72,.05,1);
    const drive=clamp(preset.drv+z*.28,0,.72);
    if(now-lastFxLT>FX_T){
      if(Math.abs(cutoff-curBassCutoff)/Math.max(1,preset.cutHi)>.015){send303Param(0,cutoff);curBassCutoff=cutoff;curCutoff=cutoff}
      if(Math.abs(reso-curBassReso)>.025){send303Param(1,Math.round(reso*100)/100);curBassReso=reso}
      if(Math.abs(env-curBassEnv)>.035){send303Param(2,Math.round(env*100)/100);curBassEnv=env}
      if(Math.abs(drive-curBassDrive)>.04){send303Param(11,Math.round(drive*100)/100);curBassDrive=drive}
      lastFxLT=now;
      setStatus(`303 ${preset.name} · CUT ${curBassCutoff} · RES ${curBassReso.toFixed(2)} · Z ${curBassEnv.toFixed(2)}`,'good');
    }
    const raw=soloPose.nonThumb>=1&&soloPose.nonThumb<=4?soloSide+'pn'+soloPose.nonThumb:null;
    if(raw!==(soloSide==='l'?lastCommL:lastCommR)){
      if(soloSide==='l')lastCommL=null;else lastCommR=null;
    }
    const conf=confGest(buf,raw,CONFIRM_N);
    if(conf){
      const fingers=parseInt(conf[3])-1;
      const noteIdx=fingers;
      if(soloSide==='l')lastCommL=conf;else lastCommR=conf;
      const e=wristVel(soloHand,soloSide==='l'?prevWristL:prevWristR);
      if(soloSide==='l')prevWristL=e.nxt;else prevWristR=e.nxt;
      if(noteIdx!==activeBassIdx&&canFire('p_note',65)){
        triggerBassNote(noteIdx,e.v);
        lastPianoTapY=soloHand[8].y;
        spawnBurst(mirror(soloHand)[8],e.v,soloSide);
        try{navigator.vibrate&&navigator.vibrate(18)}catch{}
      }else if(noteIdx===activeBassIdx){
        const tipY=soloHand[8].y;
        const tapDown=lastPianoTapY!==null&&tipY-lastPianoTapY>soloPose.sz*.18;
        if(tapDown&&canFire('p_trem_'+noteIdx,125)){
          triggerBassNote(noteIdx,e.v,true);
          spawnBurst(mirror(soloHand)[8],e.v,soloSide);
          try{navigator.vibrate&&navigator.vibrate(10)}catch{}
        }
        lastPianoTapY=tipY;
      }
    }else if(!raw){
      stopBassNote('303 RELEASE');
    }
  }else{
    rBuf=[];lBuf=[];presetBuf=[];lastCommR=null;lastCommL=null;lastPresetConf=null;prevWristR=null;prevWristL=null;stopBassNote('303 HAND LOST');
  }
}

// ── MODE FX ───────────────────────────────────────────────────────
function procFX(lmR,lmL){
  const now=Date.now();
  ensureFx();
  if(lmR){
    // Continuous: Y=cutoff, X=resonance
    const idx=lmR[8];
    const cutoff=Math.round(180+(1-idx.y)*17820);
    const reso=Math.round(idx.x*24);
    if(now-lastFxRT>FX_T){
      if(Math.abs(cutoff-curCutoff)/18000>.01){sendJ({cmd:'setFilterCutoff',value:cutoff});curCutoff=cutoff}
      if(Math.abs(reso-curReso)>1){sendJ({cmd:'setFilterResonance',value:reso});curReso=reso}
      lastFxRT=now;
      setStatus(`FX FILTER · CUT ${curCutoff} · RES ${curReso} · RVB ${reverbOn?'ON':'OFF'} · DLY ${delayOn?'ON':'OFF'}`,'good');
    }
    // Discrete FX are latched: gesture turns ON once; fist is the only reset.
    const p=getPose(lmR);
    if(!delayOn&&p.iU&&!p.mU&&!p.rU&&!p.pU&&canFire('fx_dly',600)){
      delayOn=true;curDelay=Math.max(curDelay,35);sendJ({cmd:'setDelayActive',value:true});sendJ({cmd:'setDelayMix',value:curDelay});showFlash('DLY ON','#a5d6a7');try{navigator.vibrate&&navigator.vibrate(25)}catch{}
    }else if(!reverbOn&&p.iU&&p.mU&&!p.rU&&!p.pU&&canFire('fx_rvb',600)){
      reverbOn=true;curReverb=Math.max(curReverb,45);sendJ({cmd:'setReverbActive',value:true});sendJ({cmd:'setReverbMix',value:curReverb});showFlash('RVB ON','#80cbc4');try{navigator.vibrate&&navigator.vibrate(25)}catch{}
    }else if(!distOn&&p.iU&&p.mU&&p.rU&&!p.pU&&canFire('fx_dst',600)){
      distOn=true;sendJ({cmd:'setDistortion',value:.7});showFlash('DIST ON','#ffab40');try{navigator.vibrate&&navigator.vibrate(25)}catch{}
    }else if(p.fist){
      if(!fxResetHoldStart){fxResetHoldStart=now;fxResetArmed=false;showFlash('HOLD','#ffcc80')}
      fxResetProgress=Math.min(1,(now-fxResetHoldStart)/1.15);
      setStatus(`HOLD RESET ${(fxResetProgress*100)|0}% · RELEASE TO CANCEL`,'warn');
      if(!fxResetArmed&&fxResetProgress>=1&&canFire('fx_rst',1200)){
        fxResetArmed=true;
        sendJ({cmd:'setFilterCutoff',value:8000});sendJ({cmd:'setFilterResonance',value:0});
        sendJ({cmd:'setReverbActive',value:false});sendJ({cmd:'setDelayActive',value:false});
        sendJ({cmd:'setReverbMix',value:30});sendJ({cmd:'setDelayMix',value:0});sendJ({cmd:'setDistortion',value:0});
        curCutoff=8000;curReso=0;curReverb=30;curDelay=0;delayOn=false;reverbOn=false;distOn=false;
        showFlash('FX RESET','#ef9a9a');setStatus('FX RESET DONE','hot');try{navigator.vibrate&&navigator.vibrate(55)}catch{}
      }
    }else{
      fxResetHoldStart=0;fxResetArmed=false;fxResetProgress=0;
    }
  }else{fxResetHoldStart=0;fxResetArmed=false;fxResetProgress=0}
  // Left hand normally controls ambience; right hand is fallback for one-hand FX.
  const ambHand=lmL||((reverbOn||delayOn)?lmR:null);
  if(ambHand){
    const idx=ambHand[8];
    const reverb=Math.round((1-idx.y)*100);
    const delay=Math.round(idx.x*100);
    if(now-lastFxLT>FX_T){
      if(reverbOn&&Math.abs(reverb-curReverb)>2){sendJ({cmd:'setReverbMix',value:reverb});curReverb=reverb}
      if(delayOn&&Math.abs(delay-curDelay)>2){sendJ({cmd:'setDelayMix',value:delay});curDelay=delay}
      lastFxLT=now;
      setStatus(`FX AMBIENCE · RVB ${reverbOn?curReverb:'OFF'} · DLY ${delayOn?curDelay:'OFF'} · DIST ${distOn?'ON':'OFF'}`,'good');
    }
  }
}

// ── Hand results ──────────────────────────────────────────────────
function onHandResults(res){
  liveLmR=liveLmL=null;
  if(!res.landmarks?.length){
    livePoseR=livePoseL=null;rBuf=[];lBuf=[];presetBuf=[];lastCommR=null;lastCommL=null;lastPresetConf=null;
    if(activeMode==='P')stopBassNote('303 HAND LOST');
    fxResetHoldStart=0;fxResetArmed=false;fxResetProgress=0;
    if(activeMode==='P'&&curPitch!==1){sendJ({cmd:'setLivePitch',pitch:1});curPitch=1}
    return;
  }
  for(let i=0;i<res.landmarks.length;i++){
    const lm=res.landmarks[i],lb=res.handedness?.[i]?.[0]?.categoryName||'Right';
    if(lb==='Right')liveLmR=lm;else liveLmL=lm;
  }
  livePoseR=liveLmR?getPose(liveLmR):null;
  livePoseL=liveLmL?getPose(liveLmL):null;
  switch(activeMode){
    case 'S':  procS(liveLmR,liveLmL);break;
    case 'P':  procP(liveLmR,liveLmL);break;
    case 'FX': procFX(liveLmR,liveLmL);break;
    case 'PAT':procPAT(liveLmR,liveLmL);break;
  }
}

// ── Particles ─────────────────────────────────────────────────────
function spawnBurst(lm,vel,hand){
  const rgb=hand==='r'?[255,79,67]:[52,152,219];
  const n=5+Math.round(vel/127*7);
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=.8+Math.random()*2.5*(vel/127);
    particles.push({x:lm.x,y:lm.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,rgb,r:2.5+Math.random()*3.5});
  }
}
function drawParticles(ctx,W,H){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx/W*9;p.y+=p.vy/H*9;p.life-=.048;p.r*=.97;
    if(p.life<=0){particles.splice(i,1);continue}
    ctx.beginPath();ctx.arc(p.x*W,p.y*H,Math.max(.5,p.r*p.life),0,Math.PI*2);
    ctx.fillStyle=`rgba(${p.rgb[0]},${p.rgb[1]},${p.rgb[2]},${p.life*.85})`;ctx.fill();
  }
}

// ── Hand drawing ──────────────────────────────────────────────────
const CONN=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];
function mirror(lm){return lm.map(p=>({...p,x:1-p.x}))}
function addTrail(arr,lm){const w=lm?.[0];if(!w)return;arr.push({x:w.x,y:w.y,t:Date.now()});if(arr.length>TRAIL)arr.shift()}
function drawTrail(ctx,trail,W,H,rgb){
  if(trail.length<2)return;const now=Date.now();ctx.save();ctx.lineCap='round';
  for(let i=1;i<trail.length;i++){const a=trail[i-1],b=trail[i],age=(now-b.t)/640,al=Math.max(0,1-age)*(i/trail.length);
    ctx.strokeStyle=`rgba(${rgb},${al*.55})`;ctx.lineWidth=(i/trail.length)*3.5;
    ctx.beginPath();ctx.moveTo(a.x*W,a.y*H);ctx.lineTo(b.x*W,b.y*H);ctx.stroke()}
  ctx.restore();
}
function drawHand(ctx,lm,W,H,rgb,glow){
  ctx.save();ctx.shadowColor=glow;ctx.shadowBlur=20;
  ctx.strokeStyle=`rgba(${rgb},.72)`;ctx.lineWidth=2;
  for(const[a,b]of CONN){if(!lm[a]||!lm[b])continue;ctx.beginPath();ctx.moveTo(lm[a].x*W,lm[a].y*H);ctx.lineTo(lm[b].x*W,lm[b].y*H);ctx.stroke()}
  ctx.shadowBlur=0;
  lm.forEach((p,i)=>{const tip=[4,8,12,16,20].includes(i),r=tip?6:3;
    ctx.beginPath();ctx.arc(p.x*W,p.y*H,r,0,Math.PI*2);
    if(tip){ctx.shadowColor=glow;ctx.shadowBlur=12}ctx.fillStyle=tip?glow:`rgba(${rgb},.8)`;ctx.fill();ctx.shadowBlur=0});
  ctx.restore();
}
function drawLabel(ctx,lm,W,H,text,rgb){
  if(!text)return;const p=lm[0];
  const x=p.x*W,y=p.y*H-32;
  ctx.save();ctx.font='bold 9px "Courier New",monospace';ctx.textAlign='center';
  const tw=ctx.measureText(text).width;
  ctx.fillStyle='rgba(0,0,0,.48)';ctx.fillRect(x-tw/2-5,y-11,tw+10,15);
  ctx.fillStyle=`rgba(${rgb},1)`;ctx.fillText(text,x,y);ctx.restore();
}

// ── Mode-specific canvas visuals ──────────────────────────────────
function drawFXRings(ctx,W,H){
  const cx=W/2,cy=H/2,mn=Math.min(W,H);
  const r1=mn*.1+curCutoff/18000*mn*.2,r2=r1+28+curReverb/100*mn*.15;
  ctx.save();
  ctx.strokeStyle=`rgba(255,150,30,${.1+curCutoff/18000*.3})`;ctx.lineWidth=1.8;
  ctx.shadowColor='rgba(255,120,20,.35)';ctx.shadowBlur=16;
  ctx.beginPath();ctx.arc(cx,cy,r1,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle=`rgba(52,180,255,${.06+curReverb/100*.2})`;ctx.lineWidth=1.4;
  ctx.shadowColor='rgba(52,152,219,.28)';ctx.shadowBlur=12;
  ctx.beginPath();ctx.arc(cx,cy,r2,0,Math.PI*2);ctx.stroke();
  ctx.restore();
}
function drawPianoWave(ctx,W,H){
  const hue=Math.round(190+curBassReso*70),amp=H*(.04+.000006*curBassCutoff);
  const freq=.012+curBassReso*.012,cy=H*.5;
  ctx.save();ctx.strokeStyle=`hsla(${hue},78%,62%,.4)`;ctx.lineWidth=1.8;
  ctx.shadowColor=`hsla(${hue},78%,62%,.3)`;ctx.shadowBlur=12;ctx.beginPath();
  for(let x=0;x<W;x+=4){const n=Math.sin(x*freq+synthPhase)+Math.sin(x*freq*(1.6+curBassEnv)+synthPhase*.6)*.35;x===0?ctx.moveTo(x,cy+n*amp):ctx.lineTo(x,cy+n*amp)}
  ctx.stroke();ctx.restore();
}
function drawScope(ctx,W,H,dt){
  synthPhase+=dt*(2+masterEnergy*5);
  const cy=H*.5,amp=H*(.03+.1*masterEnergy);
  ctx.save();ctx.strokeStyle=`rgba(255,79,67,${.14+.28*masterEnergy})`;ctx.lineWidth=1.3;
  ctx.shadowColor='rgba(255,79,67,.2)';ctx.shadowBlur=7;ctx.beginPath();
  for(let x=0;x<W;x+=5){const n=Math.sin(x*.018+synthPhase)+Math.sin(x*.044+synthPhase*1.7)*.3;x===0?ctx.moveTo(x,cy+n*amp):ctx.lineTo(x,cy+n*amp)}
  ctx.stroke();ctx.restore();
}
function handLabel(side){
  const pose=side==='R'?livePoseR:livePoseL;if(!pose)return'';
  const n=pose.nonThumb;
  if(activeMode==='S'){const pads=side==='R'?R_PADS:L_PADS;return n>=1&&n<=4?pads[n-1].toUpperCase():''}
  if(activeMode==='PAT'){const base=side==='R'?0:4;return n>=1&&n<=4?'PAT '+(n+base):''}
  if(activeMode==='P'){
    if(n>=1&&n<=4)return noteName(BASS_NOTES[n-1]);
    if(pose.openPalm){const p=PIANO_PRESETS[curPianoPreset]||PIANO_PRESETS[0];return p.name+' NEXT'}
    return '303';
  }
  if(activeMode==='FX')return side==='R'?(fxResetHoldStart?'HOLD RESET':'FILTER/RESO'):'RVB/DLY';
  return'';
}

// ── Render loop ───────────────────────────────────────────────────
function loop(ts){
  const now=ts*.001,dt=Math.min(lastLoopT?now-lastLoopT:.016,.05);lastLoopT=now;
  try{
    const cv=document.getElementById('mainCanvas');
    const W=Math.floor(innerWidth)||800,H=Math.floor(innerHeight)||600;
    if(cv.width!==W)cv.width=W;if(cv.height!==H)cv.height=H;
    const ctx=cv.getContext('2d');ctx.clearRect(0,0,W,H);
    // flash overlay
    if(flashAlpha>.003){ctx.fillStyle=`rgba(${flashRgb},${flashAlpha})`;ctx.fillRect(0,0,W,H);flashAlpha*=.80}
    // scope
    drawScope(ctx,W,H,dt);
    // mode visuals
    if(activeMode==='FX')drawFXRings(ctx,W,H);
    if(activeMode==='P')drawPianoWave(ctx,W,H);
    // particles
    drawParticles(ctx,W,H);
    // hands
    if(liveLmL){const ml=mirror(liveLmL);addTrail(trailL,ml);drawTrail(ctx,trailL,W,H,'52,152,219');drawHand(ctx,ml,W,H,'52,152,219','rgba(80,190,255,1)');drawLabel(ctx,ml,W,H,handLabel('L'),'52,152,219')}
    if(liveLmR){const mr=mirror(liveLmR);addTrail(trailR,mr);drawTrail(ctx,trailR,W,H,'255,79,67');drawHand(ctx,mr,W,H,'255,79,67','rgba(255,138,127,1)');drawLabel(ctx,mr,W,H,handLabel('R'),'255,79,67')}
    masterEnergy*=.93;
  }catch{}
  requestAnimationFrame(loop);
}

// ── Camera ────────────────────────────────────────────────────────
async function startCamera(){
  const ov=document.getElementById('startOverlay');ov.classList.add('gone');
  const hint=document.getElementById('gestureHint');
  try{
    hint.textContent='INICIANDO CAMARA';hint.classList.remove('hide');
    const getUM=navigator.mediaDevices?.getUserMedia
      ?c=>navigator.mediaDevices.getUserMedia(c)
      :c=>{const l=navigator.getUserMedia||navigator.webkitGetUserMedia||navigator.mozGetUserMedia;if(!l)throw new Error('getUserMedia not supported');return new Promise((r,j)=>l.call(navigator,c,r,j))};
    camStream=await getUM({video:{facingMode:'user',width:640,height:480}});
    const v=document.getElementById('videoEl');v.srcObject=camStream;v.classList.add('on');
    await new Promise(r=>{const d=()=>{v.removeEventListener('loadedmetadata',d);v.removeEventListener('canplay',d);r()};v.addEventListener('loadedmetadata',d,{once:true});v.addEventListener('canplay',d,{once:true})});
    await v.play().catch(()=>{});
    hint.textContent='CARGANDO MEDIAPIPE (necesitas internet)';hint.classList.remove('hide');
    const CDN='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
    const MODEL='https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
    const withTimeout=(p,ms,msg)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error(msg)),ms))]);
    const {FilesetResolver,HandLandmarker}=await withTimeout(
      import(CDN+'/vision_bundle.mjs'),
      30000,'Timeout: CDN no responde. Necesitas WiFi con internet.');
    hint.textContent='CARGANDO WASM…';hint.classList.remove('hide');
    const vision=await withTimeout(
      FilesetResolver.forVisionTasks(CDN+'/wasm'),
      20000,'Timeout cargando WASM.');
    hint.textContent='CARGANDO MODELO (~5s)…';hint.classList.remove('hide');
    const opts={runningMode:'VIDEO',numHands:2,minHandDetectionConfidence:.45,minHandPresenceConfidence:.45,minTrackingConfidence:.4};
    try{
      mpHands=await withTimeout(
        HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:MODEL,delegate:'GPU'},...opts}),
        25000,'Timeout modelo GPU.');
    }catch(gpuErr){
      hint.textContent='GPU FAIL, PROBANDO CPU…';hint.classList.remove('hide');
      mpHands=await withTimeout(
        HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:MODEL,delegate:'CPU'},...opts}),
        30000,'Timeout modelo CPU. Comprueba internet.');
    }
    hint.textContent='MODELO OK';
    clearTimeout(hintTmr);hintTmr=setTimeout(()=>hint.classList.add('hide'),1400);
    useCamera=true;
    handSendErrShown=false;
    const tick=()=>{
      if(useCamera&&mpHands&&v&&v.readyState>=2&&v.videoWidth>0){
        try{
          onHandResults(mpHands.detectForVideo(v,performance.now()));
        }catch(e){
          if(!handSendErrShown){
            handSendErrShown=true;
            hint.textContent='MEDIAPIPE ERROR';
            hint.classList.remove('hide');
            alert('MediaPipe no pudo procesar frames. Si estas en la WiFi del ESP sin internet, el modelo CDN no puede cargar.');
            console.warn('[GESTURE PRO] detectForVideo failed',e);
          }
        }
      }
      if(useCamera)frameHandle=requestAnimationFrame(tick);
    };
    if(frameHandle)cancelAnimationFrame(frameHandle);
    frameHandle=requestAnimationFrame(tick);
  }catch(e){
    ov.classList.remove('gone');
    alert('Cámara: '+(e?.message||'error'));
  }
}
document.getElementById('startOverlay').addEventListener('click',startCamera,{once:true});

// ── Boot ──────────────────────────────────────────────────────────
initWs();
updateModeUI();
requestAnimationFrame(loop);
</script>
