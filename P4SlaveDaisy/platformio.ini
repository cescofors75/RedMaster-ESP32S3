; P4SlaveDaisy — RayDrone visual companion
; Guition ESP32-P4 JC1060P470C, 7" 1024x600 MIPI-DSI + GT911

[platformio]
default_envs = esp32p4
build_cache_dir = .pio/build_cache

[env:esp32p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-p4
framework = arduino
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=1
    -DP4_ENABLE_DEBUG_LOG=1
    -DARDUINO_USB_MODE=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I include
    -I src/drivers
    -I src/ui
    -DLCD_H_RES=1024
    -DLCD_V_RES=600
    -DMIPI_DSI_LANES=2
    -DMIPI_DSI_LANE_BITRATE_MBPS=550
    -DLCD_BL_GPIO=23
    -DLCD_RST_GPIO=27
    -DTOUCH_RST_GPIO=22
    -DTOUCH_INT_GPIO=21
    -DTOUCH_I2C_SDA=7
    -DTOUCH_I2C_SCL=8
    -DTOUCH_I2C_ADDR=0x5D
lib_deps =
    lvgl/lvgl@8.3.11
board_build.partitions = partitions_16mb.csv
board_build.flash_size = 16MB
board_build.sdkconfig_defaults = sdkconfig.defaults
upload_port = COM21
upload_speed = 921600
monitor_port = COM21
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:esp32p4-release]
extends = env:esp32p4
build_flags =
    ${env:esp32p4.build_flags}
    -DP4_ENABLE_DEBUG_LOG=0

